<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Roll virtual dice online for board games, classroom activities, and random challenges."><title>Online Dice Roller Game | SpinWheel Game</title><link rel="stylesheet" href="css/style.css"></head><body><header id="main-site-header" class="site-header"></header><main class="section"><div class="section-inner" style="text-align:center"><h1>Online Dice Roller</h1><p>Roll one or two dice with a click.</p><div style="font-size:4rem;margin:24px" id="dice">⚄</div><button class="btn-primary" onclick="roll()">Roll Dice</button><p id="total">Your total will appear here.</p></div></main><footer id="main-site-footer" class="site-footer"></footer><script>function roll(){const a=Math.floor(Math.random()*6)+1,b=Math.floor(Math.random()*6)+1;const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];document.getElementById('dice').textContent=faces[a-1]+' '+faces[b-1];document.getElementById('total').textContent='You rolled '+(a+b)+'.'}</script><script src="js/header.js" defer></script><script src="js/footer.js" defer></script></body></html>
