<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play a free browser game of rock paper scissors against the computer."><title>Rock Paper Scissors Game | SpinWheel Game</title><link rel="stylesheet" href="css/style.css"></head><body><header id="main-site-header" class="site-header"></header><main class="section"><div class="section-inner" style="text-align:center"><h1>Rock Paper Scissors</h1><p>Choose your move and see if you can beat the computer.</p><div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:28px 0"><button class="btn-primary" onclick="play('Rock')">Rock</button><button class="btn-primary" onclick="play('Paper')">Paper</button><button class="btn-primary" onclick="play('Scissors')">Scissors</button></div><h2 id="result">Make your move!</h2><p id="score">You: 0 · Computer: 0</p></div></main><footer id="main-site-footer" class="site-footer"></footer><script>let you=0,computer=0;function play(move){const options=['Rock','Paper','Scissors'],cpu=options[Math.floor(Math.random()*3)];let text=move===cpu?'Tie!':((move==='Rock'&&cpu==='Scissors')||(move==='Paper'&&cpu==='Rock')||(move==='Scissors'&&cpu==='Paper'))?(you++,'You win!'):(computer++,'Computer wins!');document.getElementById('result').textContent=text+' You chose '+move+'; computer chose '+cpu+'.';document.getElementById('score').textContent='You: '+you+' · Computer: '+computer}</script><script src="js/header.js" defer></script><script src="js/footer.js" defer></script></body></html>
