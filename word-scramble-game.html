<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play a free word scramble game online and solve mixed-up words before the timer runs out."><title>Word Scramble Game Online | SpinWheel Game</title><link rel="stylesheet" href="css/style.css"></head><body><header id="main-site-header" class="site-header"></header><main class="section"><div class="section-inner" style="text-align:center;max-width:620px"><h1>Word Scramble</h1><p>Unscramble the letters to find the hidden word.</p><h2 id="scramble"></h2><input id="answer" aria-label="Your answer" style="padding:12px"><button class="btn-primary" onclick="check()">Check</button><p id="message"></p><button onclick="newWord()">New Word</button></div></main><footer id="main-site-footer" class="site-footer"></footer><script>const words=['planet','garden','puzzle','random','family','school'];let word='';function newWord(){word=words[Math.floor(Math.random()*words.length)];document.getElementById('scramble').textContent=word.split('').sort(()=>Math.random()-.5).join('');document.getElementById('answer').value='';document.getElementById('message').textContent=''}function check(){document.getElementById('message').textContent=document.getElementById('answer').value.toLowerCase()===word?'Correct!':'Not quite — try again.'}newWord()</script><script src="js/header.js" defer></script><script src="js/footer.js" defer></script></body></html>
