<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play a simple memory matching card game online with colorful browser cards."><title>Memory Match Card Game Online | SpinWheel Game</title><link rel="stylesheet" href="css/style.css"><style>.cards{display:grid;grid-template-columns:repeat(4,70px);gap:10px;justify-content:center;margin:24px}.card{height:70px;font-size:2rem;cursor:pointer}</style></head><body><header id="main-site-header" class="site-header"></header><main class="section"><div class="section-inner" style="text-align:center"><h1>Memory Match</h1><p>Find all matching pairs.</p><div class="cards" id="cards"></div><p id="status">0 matches</p><button onclick="start()">New Game</button></div></main><footer id="main-site-footer" class="site-footer"></footer><script>const symbols=['★','★','●','●','▲','▲','◆','◆'];let first=null,lock=false,matches=0;function start(){first=null;lock=false;matches=0;const deck=[...symbols].sort(()=>Math.random()-.5),box=document.getElementById('cards');box.innerHTML='';deck.forEach((s,i)=>{const b=document.createElement('button');b.className='card';b.textContent='?';b.dataset.symbol=s;b.onclick=()=>flip(b);box.appendChild(b)});document.getElementById('status').textContent='0 matches'}function flip(card){if(lock||card.textContent!=='?')return;card.textContent=card.dataset.symbol;if(!first){first=card;return}if(first.dataset.symbol===card.dataset.symbol){matches++;first=null;document.getElementById('status').textContent=matches+' matches'}else{lock=true;setTimeout(()=>{first.textContent='?';card.textContent='?';first=null;lock=false},700)}}start()</script><script src="js/header.js" defer></script><script src="js/footer.js" defer></script></body></html>
