<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play a free number guessing game online. Guess the hidden number from 1 to 100."><title>Number Guessing Game Online | SpinWheel Game</title><link rel="stylesheet" href="css/style.css"></head><body><header id="main-site-header" class="site-header"></header><main class="section"><div class="section-inner" style="max-width:620px;text-align:center"><h1>Number Guessing Game</h1><p>Guess the hidden number between 1 and 100.</p><label for="guess">Your guess</label><input id="guess" type="number" min="1" max="100" style="display:block;margin:16px auto;padding:12px;font-size:1rem"><button class="btn-primary" onclick="checkGuess()">Check Guess</button><h2 id="message">Good luck!</h2><button onclick="resetGame()">New Number</button></div></main><footer id="main-site-footer" class="site-footer"></footer><script>let answer=Math.floor(Math.random()*100)+1;function checkGuess(){const value=Number(document.getElementById('guess').value),m=document.getElementById('message');if(!value){m.textContent='Enter a number first.'}else if(value===answer){m.textContent='Correct! Start a new round.'}else m.textContent=value<answer?'Too low — try again.':'Too high — try again.'}function resetGame(){answer=Math.floor(Math.random()*100)+1;document.getElementById('guess').value='';document.getElementById('message').textContent='New number ready!'}</script><script src="js/header.js" defer></script><script src="js/footer.js" defer></script></body></html>
